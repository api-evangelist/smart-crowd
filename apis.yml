name: Smart Crowd
description: SmartCrowd is MENA's first and biggest regulated real estate crowdfunding
  and investment platform, based in Dubai and licensed by the Dubai Financial Services
  Authority (DFSA). It lets retail investors pool capital to co-own income-generating
  Dubai properties from as little as AED 500, offering both long-term Hold properties
  (rental yield) and short-term Flip properties (renovation upside), plus a secondary
  Share Transfer Facility for liquidity. SmartCrowd operates a consumer web and mobile
  app experience with no public developer API surface documented at this time.
